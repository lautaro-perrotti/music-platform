<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Global player</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div role="region" aria-label="Player" style="width:1440px;height:64px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:0 16px;background:#17181B;border-top:1px solid #26292E;font-family:Geist,system-ui,sans-serif;color:#EDEBE7">
<div style="width:236px;flex-shrink:0;display:flex;align-items:center;gap:12px;min-width:0">
<div style="width:40px;height:40px;flex-shrink:0;border-radius:6px;background:#23252A;border:1px solid #2F3238;display:flex;align-items:center;justify-content:center"><svg width="28" height="20" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><path d="{{tile}}" fill="#CFCBC4"></path></svg></div>
<div style="min-width:0;display:flex;flex-direction:column;gap:2px">
<div style="font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{title}}</div>
<div style="font-size:12px;color:#8D8A85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{sub}}</div>
</div>
</div>
<div style="display:flex;align-items:center;gap:4px">
<button aria-label="Previous section" style="width:32px;height:32px;border:0;border-radius:6px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="#B0ADA7" aria-hidden="true"><path d="M5 5h2.5v14H5zM19 5v14L8.5 12z"></path></svg></button>
<button aria-label="{{playLabel}}" style="width:36px;height:36px;border:0;border-radius:50%;background:#ECE8E1;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="#141518" aria-hidden="true"><path d="{{playPath}}"></path></svg></button>
<button aria-label="Next section" style="width:32px;height:32px;border:0;border-radius:6px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="#B0ADA7" aria-hidden="true"><path d="M16.5 5H19v14h-2.5zM5 5v14l10.5-7z"></path></svg></button>
<button aria-label="Loop" aria-pressed="{{loopOn}}" style="width:32px;height:32px;border:0;border-radius:6px;background:{{loopBg}};display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{loopColor}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V9a3 3 0 0 1 3-3h12l-3-3M20 13v2a3 3 0 0 1-3 3H5l3 3"></path></svg></button>
</div>
<span style="font-family:'Geist Mono',monospace;font-size:12px;color:#EDEBE7;width:40px;text-align:right">{{time}}</span>
<div aria-label="Seek" style="position:relative;width:420px;height:36px;flex-shrink:0">
<svg width="420" height="36" viewBox="0 0 1000 100" preserveAspectRatio="none" style="position:absolute;left:0;top:0" aria-hidden="true"><path d="{{wave}}" fill="#3C3F45"></path></svg>
<div style="position:absolute;left:0;top:0;height:36px;width:{{posPx}}px;overflow:hidden"><svg width="420" height="36" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><path d="{{wave}}" fill="#CFCBC4"></path></svg></div>
<div style="position:absolute;left:{{posPx}}px;top:-2px;width:2px;height:40px;background:#5EC6D3;border-radius:1px"></div>
</div>
<span style="font-family:'Geist Mono',monospace;font-size:12px;color:#8D8A85;width:40px">{{dur}}</span>
<div style="flex:1"></div>
<sc-if value="{{hasAB}}" hint-placeholder-val="{{false}}">
<div style="display:flex;align-items:center;gap:8px">
<div role="group" aria-label="A/B" style="display:flex;padding:2px;border-radius:6px;background:#1F2126;border:1px solid #2B2E34">
<button aria-pressed="{{aOn}}" style="width:30px;height:24px;border:0;border-radius:4px;background:{{aBg}};color:{{aFg}};font-family:'Geist Mono',monospace;font-size:12px;font-weight:600;cursor:pointer">A</button>
<button aria-pressed="{{bOn}}" style="width:30px;height:24px;border:0;border-radius:4px;background:{{bBg}};color:{{bFg}};font-family:'Geist Mono',monospace;font-size:12px;font-weight:600;cursor:pointer">B</button>
</div>
<span style="display:flex;align-items:center;gap:5px;font-size:11.5px;color:#5EC6D3"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#5EC6D3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>Synced</span>
</div>
</sc-if>
<sc-if value="{{noAB}}" hint-placeholder-val="{{true}}">
<span title="Nothing to compare yet" style="height:28px;padding:0 10px;border-radius:6px;border:1px dashed #34373D;color:#6F6C68;font-family:'Geist Mono',monospace;font-size:12px;display:flex;align-items:center">A/B</span>
</sc-if>
<div style="display:flex;align-items:center;gap:8px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B0ADA7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z M16 9a4 4 0 0 1 0 6"></path></svg>
<div aria-label="Volume 70%" style="width:64px;height:4px;border-radius:2px;background:#2B2E34"><div style="width:45px;height:4px;border-radius:2px;background:#B0ADA7"></div></div>
</div>
<a href="Chat.dc.html" style="display:flex;align-items:center;gap:8px;height:32px;padding:0 10px 0 6px;border-radius:6px;background:#1F2126;border:1px solid #2B2E34;color:#EDEBE7;text-decoration:none;font-size:12.5px">
<span style="width:20px;height:20px;border-radius:50%;background:#ECE8E1;color:#141518;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">L</span>Ask Lucas<span style="font-family:'Geist Mono',monospace;font-size:11px;padding:0 5px;border-radius:4px;border:1px solid #3A3D44;color:#8D8A85">/</span></a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":null,"default":"Afro Groove v7"},"sub":{"editor":null,"default":"Rhythm Ashanti · Full mix"},"time":{"editor":null,"default":"01:23"},"dur":{"editor":null,"default":"05:32"},"pos":{"editor":"range","min":0,"max":1,"step":0.01,"default":0.25},"ab":{"editor":"enum","options":["off","A","B"],"default":"off"},"playing":{"editor":"boolean","default":true},"loop":{"editor":"boolean","default":false},"seed":{"editor":null,"default":"7"},"$preview":{"width":1440,"height":64}}'>
function rng(s){s=(s*7919)%2147483647||1;return function(){s=(s*16807)%2147483647;return (s-1)/2147483646;};}
var SONG=[[0,.25],[.09,.35],[.095,.62],[.18,.66],[.185,.9],[.27,.92],[.275,.4],[.316,.5],[.361,.7],[.365,1],[.542,.97],[.548,.72],[.813,.7],[.82,.45],[1,.08]];
function env(p,E){for(var i=1;i<E.length;i++){if(p<=E[i][0]){var a=E[i-1],b=E[i],t=(p-a[0])/((b[0]-a[0])||1);return a[1]+(b[1]-a[1])*t;}}return E[E.length-1][1];}
function wf(seed,o){o=o||{};var n=o.n||220,E=o.env||SONG,j=o.jag==null?.5:o.jag,r=rng(seed),t=[],b=[];for(var i=0;i<=n;i++){var x=(i/n*1000).toFixed(1),e=env(i/n,E),a=Math.max(1.2,e*((1-j)+j*r())*47);t.push(x+' '+(50-a).toFixed(1));b.unshift(x+' '+(50+a*.9).toFixed(1));}return 'M'+t.join('L')+'L'+b.join('L')+'Z';}
class Component extends DCLogic {
  renderVals() {
    var p = this.props;
    var pos = Number(p.pos ?? 0.25);
    var ab = p.ab || 'off';
    var playing = !(p.playing === false || p.playing === 'false');
    var loop = p.loop === true || p.loop === 'true';
    var seed = Number(p.seed || 7);
    return {
      title: p.title || 'Afro Groove v7', sub: p.sub || 'Rhythm Ashanti · Full mix', time: p.time || '01:23', dur: p.dur || '05:32',
      wave: wf(seed, { n: 160 }), tile: wf(seed, { n: 24 }), posPx: Math.round(420 * pos),
      playLabel: playing ? 'Pause' : 'Play', playPath: playing ? 'M7 5h3.5v14H7zM13.5 5H17v14h-3.5z' : 'M8 5.5v13l11-6.5z',
      loopOn: loop ? 'true' : 'false', loopBg: loop ? '#1E3437' : 'transparent', loopColor: loop ? '#5EC6D3' : '#B0ADA7',
      hasAB: ab !== 'off', noAB: ab === 'off', aOn: ab === 'A' ? 'true' : 'false', bOn: ab === 'B' ? 'true' : 'false',
      aBg: ab === 'A' ? '#ECE8E1' : 'transparent', aFg: ab === 'A' ? '#141518' : '#8D8A85', bBg: ab === 'B' ? '#ECE8E1' : 'transparent', bFg: ab === 'B' ? '#141518' : '#8D8A85'
    };
  }
}
</script>
</body>
</html>
