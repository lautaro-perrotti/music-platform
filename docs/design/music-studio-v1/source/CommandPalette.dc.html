<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1012}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width:1440px;height:900px;display:flex;flex-direction:column;background:#0F1012;font-family:Geist,system-ui,sans-serif;color:#EDEBE7;font-size:13.5px;overflow:hidden;position:relative">
<div style="height:48px;flex-shrink:0"><dc-import name="TopBar" hint-size="1440px,48px"></dc-import></div>
<div style="display:flex;height:788px;flex-shrink:0">
<div style="width:212px;flex-shrink:0"><dc-import name="Sidebar" active="project" hint-size="212px,788px"></dc-import></div>
<main style="flex:1;min-width:0;padding:24px 32px;display:flex;flex-direction:column;gap:16px">
<h1 style="margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em">Rhythm Ashanti</h1>
<div style="height:220px;background:#17181B;border:1px solid #26292E;border-radius:8px"></div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px"><div style="height:260px;background:#17181B;border:1px solid #26292E;border-radius:8px"></div><div style="height:260px;background:#17181B;border:1px solid #26292E;border-radius:8px"></div></div>
</main>
</div>
<div style="height:64px;flex-shrink:0"><dc-import name="Player" hint-size="1440px,64px"></dc-import></div>

<div style="position:absolute;inset:0;background:rgba(8,9,10,0.6);display:flex;justify-content:center;padding-top:120px">
<div role="dialog" aria-modal="true" aria-label="Command palette" style="width:640px;height:520px;background:#1B1C20;border:1px solid #3A3D44;border-radius:10px;box-shadow:0 24px 64px rgba(0,0,0,0.6);display:flex;flex-direction:column;overflow:hidden">
<div style="display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:1px solid #2B2E34">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8D8A85" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM20 20l-4-4"></path></svg>
<input aria-label="Search or run a command" value="ver" style="flex:1;border:0;background:transparent;outline:none;font-size:15px;color:#EDEBE7">
<span style="font-family:'Geist Mono',monospace;font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid #3A3D44;color:#8D8A85">Esc</span>
</div>
<div role="listbox" style="flex:1;overflow:hidden;padding:6px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="padding:10px 10px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8D8A85">{{g.t}}</div>
<sc-for list="{{g.items}}" as="i" hint-placeholder-count="4">
<a role="option" aria-selected="{{i.sel}}" href="{{i.href}}" style="display:flex;align-items:center;gap:12px;height:38px;padding:0 10px;border-radius:6px;background:{{i.bg}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B0ADA7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"></path></svg>
<span style="flex:1;font-size:13.5px">{{i.l}}</span>
<span style="font-size:12px;color:#8D8A85">{{i.m}}</span>
<sc-if value="{{i.k}}" hint-placeholder-val="{{false}}"><span style="font-family:'Geist Mono',monospace;font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid #3A3D44;color:#8D8A85">{{i.k}}</span></sc-if>
</a>
</sc-for>
</sc-for>
</div>
<div style="display:flex;gap:16px;height:36px;align-items:center;padding:0 16px;border-top:1px solid #2B2E34;font-size:11.5px;color:#8D8A85"><span>↑↓ move</span><span>↵ open</span><span>Tab actions</span><span style="flex:1"></span><span>Type “?” to ask Lucas</span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var V = 'M6 3v18M6 8c6 0 12 1 12 8v5', P = 'M4 10.5 12 4l8 6.5V20H4z', C = 'M4 8h13l-3-3M20 16H7l3 3';
    function it(l, m, d, href, k, sel) { return { l: l, m: m, d: d, href: href, k: k || false, sel: sel ? 'true' : 'false', bg: sel ? '#2A2C32' : 'transparent' }; }
    return {
      groups: [
        { t: 'Versions', items: [it('Stronger Drop 2 v8', 'Rhythm Ashanti · new', V, 'Versions.dc.html', '', true), it('Afro Groove v7', 'Rhythm Ashanti · active', V, 'Versions.dc.html'), it('Live Bass v5', 'Salt & Copper', V, 'Versions.dc.html')] },
        { t: 'Actions', items: [it('Open versions', '', V, 'Versions.dc.html'), it('Compare versions', '', C, 'VersionCompare.dc.html', 'A B'), it('Generate music', '', 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z', 'Create.dc.html', 'G'), it('Ask Lucas', '', 'M4 5h16v11H9l-5 4z', 'Chat.dc.html', '/')] },
        { t: 'Projects', items: [it('Rhythm Ashanti', 'Funky club house', P, 'ProjectHome.dc.html'), it('Vellum', 'Minimal techno', P, 'Projects.dc.html')] }
      ]
    };
  }
}
</script>
</body>
</html>
