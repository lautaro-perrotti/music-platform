<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width:212px;height:788px;box-sizing:border-box;background:#141518;border-right:1px solid #26292E;display:flex;flex-direction:column;padding:12px 10px;font-family:Geist,system-ui,sans-serif;color:#EDEBE7">
<sc-for list="{{top}}" as="it" hint-placeholder-count="1">
<a href="{{it.href}}" style="display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;text-decoration:none;font-size:13.5px;font-weight:{{it.fw}};color:{{it.fg}};background:{{it.bg}}">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{it.ic}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
<span style="flex:1">{{it.label}}</span>
</a>
</sc-for>
<div style="padding:16px 10px 6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8D8A85">Rhythm Ashanti</div>
<div style="display:flex;flex-direction:column;gap:1px">
<sc-for list="{{song}}" as="it" hint-placeholder-count="9">
<a href="{{it.href}}" style="display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;text-decoration:none;font-size:13.5px;font-weight:{{it.fw}};color:{{it.fg}};background:{{it.bg}}">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{it.ic}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
<span style="flex:1">{{it.label}}</span>
<sc-if value="{{it.kbd}}" hint-placeholder-val="{{false}}"><span style="font-family:'Geist Mono',monospace;font-size:11px;color:#6F6C68">{{it.kbd}}</span></sc-if>
</a>
</sc-for>
</div>
<div style="padding:16px 10px 6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8D8A85">Work</div>
<div style="display:flex;flex-direction:column;gap:1px">
<sc-for list="{{work}}" as="it" hint-placeholder-count="3">
<a href="{{it.href}}" style="display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;text-decoration:none;font-size:13.5px;font-weight:{{it.fw}};color:{{it.fg}};background:{{it.bg}}">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{it.ic}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
<span style="flex:1">{{it.label}}</span>
<sc-if value="{{it.badge}}" hint-placeholder-val="{{false}}"><span style="min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:#23373A;color:#5EC6D3;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center">{{it.badge}}</span></sc-if>
<sc-if value="{{it.dot}}" hint-placeholder-val="{{false}}"><span style="display:flex;align-items:center;gap:6px;font-size:11.5px;color:#8D8A85"><span style="width:7px;height:7px;border-radius:50%;background:{{it.dot}}"></span>{{it.dotLabel}}</span></sc-if>
</a>
</sc-for>
</div>
<div style="flex:1"></div>
<div style="border-top:1px solid #26292E;padding-top:8px;display:flex;flex-direction:column;gap:1px">
<sc-for list="{{sys}}" as="it" hint-placeholder-count="2">
<a href="{{it.href}}" style="display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:6px;text-decoration:none;font-size:13px;font-weight:{{it.fw}};color:{{it.fg}};background:{{it.bg}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{it.ic}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
<span style="flex:1">{{it.label}}</span>
</a>
</sc-for>
<div style="display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 10px;margin-top:4px">
<span style="font-size:12.5px;color:#8D8A85">Advanced mode</span>
<button role="switch" aria-checked="{{advOn}}" aria-label="Advanced mode" style="width:30px;height:18px;border-radius:9px;border:0;padding:2px;background:{{advTrack}};display:flex;justify-content:{{advJustify}};cursor:pointer"><span style="width:14px;height:14px;border-radius:50%;background:#ECE8E1;display:block"></span></button>
</div>
</div>
</nav>
</x-dc>

</body>
</html>
