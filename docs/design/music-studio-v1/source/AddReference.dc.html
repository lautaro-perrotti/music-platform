</div>
<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:baseline;gap:8px"><span style="font-size:14px;font-weight:600">Use this reference for</span><span style="font-size:12px;color:#8D8A85">3 selected</span></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">

<span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:13px;font-weight:500">{{d.l}}</span><span style="font-size:11.5px;color:#8D8A85;line-height:1.35">{{d.d}}</span></span>
</button>
</sc-for>
</div>
</div>
</div>
<div style="display:flex;align-items:center;gap:10px;padding:14px 20px;border-top:1px solid #2B2E34">
<span style="font-size:12px;color:#8D8A85;flex:1">Analysis starts right after adding and takes about a minute. You can change these choices later.</span>

</div>
</div>
</div>
</div>
