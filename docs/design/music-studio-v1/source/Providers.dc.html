<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings providers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1012}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width:1440px;height:900px;display:flex;flex-direction:column;background:#0F1012;font-family:Geist,system-ui,sans-serif;color:#EDEBE7;font-size:13.5px;overflow:hidden">
<div style="height:48px;flex-shrink:0"><dc-import name="TopBar" hint-size="1440px,48px"></dc-import></div>
<div style="display:flex;height:788px;flex-shrink:0">
<div style="width:212px;flex-shrink:0"><dc-import name="Sidebar" active="settings" advanced="true" hint-size="212px,788px"></dc-import></div>
<main style="flex:1;min-width:0;display:flex;overflow:hidden">
<nav aria-label="Settings" style="width:200px;flex-shrink:0;border-right:1px solid #26292E;padding:24px 12px;display:flex;flex-direction:column;gap:2px">
<div style="padding:0 10px 10px;font-size:15px;font-weight:600">Settings</div>
<sc-for list="{{nav}}" as="n" hint-placeholder-count="6"><button style="height:32px;padding:0 10px;border-radius:6px;border:0;background:{{n.bg}};color:{{n.fg}};text-align:left;font-size:13px">{{n.l}}</button></sc-for>
</nav>
<div style="flex:1;min-width:0;padding:24px 32px;display:flex;flex-direction:column;gap:18px;overflow:hidden">
<div style="display:flex;flex-direction:column;gap:4px"><h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.01em">Providers</h1><div style="font-size:12.5px;color:#8D8A85">Where the work happens. The creative screens only ask for quality, and choose a provider from what’s set here.</div></div>
<div style="display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:8px;background:#17181B;border:1px solid #26292E">
<span style="font-size:13px;font-weight:500;flex:1">Default for new work</span>
<div role="radiogroup" aria-label="Default" style="display:flex;padding:2px;border-radius:6px;background:#1D1F23;border:1px solid #2B2E34"><button role="radio" aria-checked="true" style="height:30px;padding:0 14px;border:0;border-radius:4px;background:#34373D;font-size:12.5px">Best available</button><button role="radio" aria-checked="false" style="height:30px;padding:0 14px;border:0;border-radius:4px;background:transparent;color:#8D8A85;font-size:12.5px">Local only</button><button role="radio" aria-checked="false" style="height:30px;padding:0 14px;border:0;border-radius:4px;background:transparent;color:#8D8A85;font-size:12.5px">Fast</button></div>
</div>
<sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
<section style="display:flex;flex-direction:column;gap:8px">
<h2 style="margin:0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8D8A85">{{c.t}}</h2>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<sc-for list="{{c.items}}" as="p" hint-placeholder-count="2">
<div style="background:#17181B;border:1px solid #26292E;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:8px"><span style="font-size:13.5px;font-weight:600">{{p.n}}</span><span style="font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid #34373D;color:#B0ADA7">{{p.loc}}</span><span style="flex:1"></span><span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:{{p.c}}"><span style="font-size:11px">{{p.g}}</span>{{p.s}}</span></div>
<div style="font-size:12px;color:#8D8A85">{{p.caps}}</div>
<div style="display:flex;align-items:center;gap:8px;font-size:12px"><span style="color:#8D8A85">Quality</span><span>{{p.q}}</span><span style="flex:1"></span><sc-if value="{{p.act}}" hint-placeholder-val="{{false}}"><button style="height:26px;padding:0 10px;border-radius:6px;background:#24262B;border:1px solid #34373D;font-size:12px">{{p.act}}</button></sc-if></div>
</div>
</sc-for>
</div>
</section>
</sc-for>
<div style="font-size:12px;color:#8D8A85">Keys are stored in the OS keychain and are never written to project files.</div>
</div>
</main>
</div>
<div style="height:64px;flex-shrink:0"><dc-import name="Player" hint-size="1440px,64px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
var H={ready:['✓','Ready','#5CC08C'],cred:['◆','Credential required','#93A7FF'],unavailable:['✕','Unavailable','#EF6A5F'],blocked:['⊘','Blocked','#E2BE5A']};
function p(n,loc,k,caps,q,act){var s=H[k];return {n:n,loc:loc,g:s[0],s:s[1],c:s[2],caps:caps,q:q,act:act||false};}
class Component extends DCLogic {
  renderVals() {
    return {
      nav: ['General', 'Audio', 'Shortcuts', 'Providers', 'Ableton', 'Account'].map(function (l) { var on = l === 'Providers'; return { l: l, bg: on ? '#24262B' : 'transparent', fg: on ? '#EDEBE7' : '#B0ADA7' }; }),
      cats: [
        { t: 'Music generation', items: [p('ElevenMusic', 'Cloud', 'ready', 'Up to 10 min · vocals · references · BPM · key · swing', 'Best'), p('ACE-Step', 'Local', 'unavailable', 'BPM · key · no references · no swing', 'Good', 'Retry')] },
        { t: 'Voice', items: [p('ElevenLabs', 'Cloud', 'cred', 'Lead, double, harmony · 29 languages', 'Best', 'Add key'), p('Local voice', 'Local', 'blocked', 'Lead only · English', 'Draft')] },
        { t: 'Stem separation', items: [p('Separation pool', 'Local', 'ready', '4 methods · blind review · per-stem winners', 'Best')] },
        { t: 'Analysis', items: [p('Core analysis', 'Local', 'ready', 'Tempo · key · sections · loudness · spectrum', 'Measured')] }
      ]
    };
  }
}
</script>
</body>
</html>
