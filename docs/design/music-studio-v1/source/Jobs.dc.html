<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jobs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1012}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width:1440px;height:900px;display:flex;flex-direction:column;background:#0F1012;font-family:Geist,system-ui,sans-serif;color:#EDEBE7;font-size:13.5px;overflow:hidden">
<div style="height:48px;flex-shrink:0"><dc-import name="TopBar" hint-size="1440px,48px"></dc-import></div>
<div style="display:flex;height:788px;flex-shrink:0">
<div style="width:212px;flex-shrink:0"><dc-import name="Sidebar" active="jobs" hint-size="212px,788px"></dc-import></div>
<main style="flex:1;min-width:0;padding:24px 32px;display:flex;flex-direction:column;gap:16px;overflow:hidden">
<div style="display:flex;align-items:flex-end;gap:12px">
<div style="flex:1;display:flex;flex-direction:column;gap:4px"><h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.01em">Jobs</h1><div style="font-size:12.5px;color:#8D8A85">Background work across all songs. It keeps running while you produce.</div></div>
</div>
<div role="tablist" aria-label="Filter" style="display:flex;gap:6px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="5"><button role="tab" aria-selected="{{t.sel}}" style="height:28px;padding:0 12px;border-radius:6px;background:{{t.bg}};border:1px solid {{t.bd}};color:{{t.fg}};font-size:12.5px">{{t.l}} <span style="color:#8D8A85">{{t.n}}</span></button></sc-for>
</div>
<div role="table" aria-label="Jobs" style="background:#17181B;border:1px solid #26292E;border-radius:8px;overflow:hidden">
<div role="row" style="display:grid;grid-template-columns:170px minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.6fr) 80px 90px;align-items:center;height:36px;padding:0 16px;border-bottom:1px solid #26292E;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8D8A85"><span>Status</span><span>Job</span><span>Song</span><span>Stage or result</span><span>Elapsed</span><span style="text-align:right">Started</span></div>
<sc-for list="{{jobs}}" as="j" hint-placeholder-count="12">
<a role="row" href="JobDetail.dc.html" style="display:grid;grid-template-columns:170px minmax(0,1.6fr) minmax(0,1fr) minmax(0,1.6fr) 80px 90px;align-items:center;height:48px;padding:0 16px;border-bottom:1px solid #222429;background:{{j.bg}}">
<span><span style="display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:4px;font-size:12px;font-weight:500;color:{{j.s.c}};background:{{j.s.bg}}"><span style="width:10px;text-align:center;font-size:11px">{{j.s.g}}</span>{{j.s.l}}</span></span>
<span style="font-size:13px;font-weight:500">{{j.t}}</span>
<span style="font-size:12.5px;color:#B0ADA7">{{j.p}}</span>
<span style="font-size:12.5px;color:{{j.mc}}">{{j.m}}</span>
<span style="font-family:'Geist Mono',monospace;font-size:12px;color:#B0ADA7">{{j.e}}</span>
<span style="text-align:right;font-size:12px;color:#8D8A85">{{j.at}}</span>
</a>
</sc-for>
</div>
</main>
</div>
<div style="height:64px;flex-shrink:0"><dc-import name="Player" hint-size="1440px,64px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
var ST={queued:['○','Queued','#8D8A85'],provisioning:['◌','Provisioning','#5EC6D3'],running:['●','Running','#5EC6D3'],validating:['◐','Validating','#5EC6D3'],review:['◆','Review required','#93A7FF'],ok:['✓','Succeeded','#5CC08C'],failed:['✕','Failed','#EF6A5F'],blocked:['⊘','Blocked','#E2BE5A'],cancelled:['–','Cancelled','#8D8A85'],doubt:['?','In doubt','#F08A4B']};
function st(k,l){var s=ST[k];return {g:s[0],l:l||s[1],c:s[2],bg:s[2]+'1F'};}
class Component extends DCLogic {
  renderVals() {
    var J = [
      ['running', 'Generate 4 versions', 'Rhythm Ashanti', 'Generating candidate 3 of 4', '3:12', '01:32', true],
      ['running', 'Analyze reference', 'Rhythm Ashanti', 'Warehouse bassline · detecting sections', '0:41', '01:50'],
      ['provisioning', 'Generate double', 'Rhythm Ashanti', 'Loading voice model', '0:09', '02:07'],
      ['validating', 'Separate stems', 'Night Market', 'Checking files', '2:31', '01:44'],
      ['doubt', 'Apply Live Bass v5', 'Salt & Copper', 'A write may have happened but wasn’t verified', '—', 'Yesterday'],
      ['review', 'Separate stems', 'Rhythm Ashanti', 'Pick an “Other” stem', '2:40', '01:40'],
      ['queued', 'Prepare waveform', 'Rhythm Ashanti', 'Candidate D · waits for generation', '—', '01:32'],
      ['blocked', 'Analyze mix', 'Night Market', 'Waiting for Ableton. Not attached.', '—', '01:12'],
      ['failed', 'Generate adlibs', 'Carabela', 'Local voice runtime unavailable', '0:14', 'Sep 18'],
      ['ok', 'Prepare waveform', 'Rhythm Ashanti', 'Candidate B', '0:04', '01:37'],
      ['ok', 'Apply Afro Groove v7', 'Rhythm Ashanti', 'Verified in Ableton', '0:06', '01:48'],
      ['cancelled', 'Generate 2 versions', 'Low Tide', 'Cancelled by you', '0:52', 'Sep 12']
    ];
    var colors = { doubt: '#F08A4B', failed: '#EF6A5F', blocked: '#E2BE5A', review: '#93A7FF' };
    return {
      tabs: [['All', '12', 1], ['Running', '4', 0], ['Needs attention', '4', 0], ['Done', '2', 0], ['Failed', '1', 0]].map(function (t) { return { l: t[0], n: t[1], sel: t[2] ? 'true' : 'false', bg: t[2] ? '#24262B' : 'transparent', bd: t[2] ? '#34373D' : '#2B2E34', fg: t[2] ? '#EDEBE7' : '#B0ADA7' }; }),
      jobs: J.map(function (j) { return { s: st(j[0]), t: j[1], p: j[2], m: j[3], e: j[4], at: j[5], mc: colors[j[0]] || '#B0ADA7', bg: j[6] ? '#1D1F23' : 'transparent' }; })
    };
  }
}
</script>
</body>
</html>
