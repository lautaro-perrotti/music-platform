<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="width:1440px;height:48px;box-sizing:border-box;display:flex;align-items:center;background:#141518;border-bottom:1px solid #26292E;font-family:Geist,system-ui,sans-serif;color:#EDEBE7;font-size:13px;padding-right:12px">
<a href="Projects.dc.html" style="width:212px;flex-shrink:0;height:47px;display:flex;align-items:center;gap:10px;padding-left:18px;color:#EDEBE7;text-decoration:none;border-right:1px solid #26292E">
<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="0.5" y="0.5" width="21" height="21" rx="5" fill="#ECE8E1"></rect><rect x="5" y="8" width="2.4" height="6" rx="1.2" fill="#141518"></rect><rect x="9.8" y="4.5" width="2.4" height="13" rx="1.2" fill="#141518"></rect><rect x="14.6" y="7" width="2.4" height="8" rx="1.2" fill="#141518"></rect></svg>
<span style="font-size:14px;font-weight:600;letter-spacing:-0.01em">Music Studio</span>
</a>
<div style="display:flex;align-items:center;gap:2px;padding-left:10px">
<a href="Projects.dc.html" style="display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:6px;color:#EDEBE7;text-decoration:none;font-weight:500">Rhythm Ashanti<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8D8A85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></a>
<span style="color:#4A4C52">/</span>
<a href="Versions.dc.html" style="display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:6px;color:#EDEBE7;text-decoration:none">
<span style="width:7px;height:7px;border-radius:50%;background:#ECE8E1"></span>{{version}}<span style="font-size:11px;color:#8D8A85;border:1px solid #34373D;border-radius:4px;padding:1px 5px">Active</span></a>
</div>
<div style="flex:1;display:flex;justify-content:center">
<a href="CommandPalette.dc.html" style="width:380px;height:32px;display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:6px;background:#1D1F23;border:1px solid #2B2E34;color:#8D8A85;text-decoration:none">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8D8A85" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM20 20l-4-4"></path></svg>
<span style="flex:1">Search, jump, or run a command</span>
<span style="font-family:'Geist Mono',monospace;font-size:11px;padding:1px 5px;border-radius:4px;border:1px solid #3A3D44;color:#8D8A85">Ctrl K</span>
</a>
</div>
<div style="display:flex;align-items:center;gap:6px">
<a href="Ableton.dc.html" style="display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:6px;border:1px solid #2B2E34;color:#B0ADA7;text-decoration:none;font-size:12.5px">
<span style="width:8px;height:8px;border-radius:50%;background:{{liveColor}}"></span>Live 12<span style="color:{{liveText}};font-weight:500">{{liveLabel}}</span></a>
<a href="Providers.dc.html" style="display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:6px;border:1px solid #2B2E34;color:#B0ADA7;text-decoration:none;font-size:12.5px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8D8A85" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10H7zM10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4"></path></svg>Best available</a>
<a href="Jobs.dc.html" style="display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:6px;background:#1D1F23;border:1px solid #2B2E34;color:#EDEBE7;text-decoration:none;font-size:12.5px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.4" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke="#34373D"></circle><path d="M12 4a8 8 0 0 1 8 8" stroke="#5EC6D3" stroke-linecap="round"></path></svg>{{jobLabel}}</a>
<button aria-label="Notifications" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:6px;border:0;background:transparent;cursor:pointer;position:relative">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B0ADA7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5h4"></path></svg>
<span style="position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:#5EC6D3;border:1.5px solid #141518"></span>
</button>
<span aria-label="Lucas Perrotti" style="width:28px;height:28px;border-radius:50%;background:#2A2C32;border:1px solid #3A3D44;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#EDEBE7">LP</span>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"version":{"editor":null,"default":"Afro Groove v7"},"jobs":{"editor":null,"default":"2"},"live":{"editor":"enum","options":["connected","doubt","degraded","disconnected"],"default":"connected"},"$preview":{"width":1440,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    var live = this.props.live || 'connected';
    var M = { connected: ['#5CC08C', 'Connected', '#B0ADA7'], doubt: ['#F08A4B', 'In doubt', '#F08A4B'], degraded: ['#E2BE5A', 'Degraded', '#E2BE5A'], disconnected: ['#5E5C59', 'Not connected', '#8D8A85'] };
    var m = M[live] || M.connected;
    var jobs = this.props.jobs ?? '2';
    return { version: this.props.version || 'Afro Groove v7', liveColor: m[0], liveLabel: m[1], liveText: m[2], jobLabel: jobs === '0' ? 'No jobs' : jobs + ' running' };
  }
}
</script>
</body>
</html>
