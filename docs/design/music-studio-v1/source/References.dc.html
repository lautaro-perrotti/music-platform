<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>References</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F1012}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width:1440px;height:900px;display:flex;flex-direction:column;background:#0F1012;font-family:Geist,system-ui,sans-serif;color:#EDEBE7;font-size:13.5px;overflow:hidden">
<div style="height:48px;flex-shrink:0"><dc-import name="TopBar" hint-size="1440px,48px"></dc-import></div>
<div style="display:flex;height:788px;flex-shrink:0">
<div style="width:212px;flex-shrink:0"><dc-import name="Sidebar" active="references" hint-size="212px,788px"></dc-import></div>
<main style="flex:1;min-width:0;padding:24px 32px;display:flex;flex-direction:column;gap:16px;overflow:hidden">
<div style="display:flex;align-items:flex-end;gap:12px">
<div style="flex:1;display:flex;flex-direction:column;gap:4px"><h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.01em">References</h1><div style="font-size:12.5px;color:#8D8A85">Tracks and sketches that guide groove, arrangement or sound. Each one says what it’s used for.</div></div>
<label style="width:260px;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:6px;background:#1D1F23;border:1px solid #2B2E34"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8D8A85" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14zM20 20l-4-4"></path></svg><input aria-label="Search references" placeholder="Search references" style="flex:1;border:0;background:transparent;outline:none;font-size:13px"></label>
<a href="AddReference.dc.html" style="height:34px;padding:0 14px;border-radius:6px;background:#ECE8E1;color:#141518;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px">+ Add reference</a>
</div>
<div role="tablist" aria-label="Type" style="display:flex;gap:6px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="6"><button role="tab" aria-selected="{{t.sel}}" style="height:28px;padding:0 12px;border-radius:6px;background:{{t.bg}};border:1px solid {{t.bd}};color:{{t.fg}};font-size:12.5px">{{t.l}}</button></sc-for>
</div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px">
<sc-for list="{{refs}}" as="r" hint-placeholder-count="6">
<a href="ReferenceDetail.dc.html" style="background:#17181B;border:1px solid {{r.bd}};border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:flex-start;gap:8px">
<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.t}}</span><span style="font-size:12px;color:#8D8A85">{{r.k}} · <span style="font-family:'Geist Mono',monospace">{{r.d}}</span></span></div>
<span style="font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid #34373D;color:{{r.rc}};white-space:nowrap">{{r.rights}}</span>
</div>
<div style="height:56px;background:#141518;border-radius:4px;position:relative">
<svg width="100%" height="56" viewBox="0 0 1000 100" preserveAspectRatio="none" style="position:absolute;left:0;top:0" aria-hidden="true"><path d="{{r.w}}" fill="{{r.wc}}"></path></svg>
</div>
<div style="display:flex;align-items:center;gap:8px;min-height:22px">
<span style="font-size:12px;color:{{r.ac}}">{{r.a}}</span>
<span style="flex:1"></span>
<span style="font-size:11.5px;color:#B0ADA7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px">{{r.use}}</span>
</div>
</a>
</sc-for>
</div>
</main>
</div>
<div style="height:64px;flex-shrink:0"><dc-import name="Player" title="The Funk" sub="Sophia Guerrero · reference" seed="501" hint-size="1440px,64px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
function rng(s){s=(s*7919)%2147483647||1;return function(){s=(s*16807)%2147483647;return (s-1)/2147483646;};}
var SONG=[[0,.25],[.09,.35],[.095,.62],[.18,.66],[.185,.9],[.27,.92],[.275,.4],[.316,.5],[.361,.7],[.365,1],[.542,.97],[.548,.72],[.813,.7],[.82,.45],[1,.08]];
function env(p,E){for(var i=1;i<E.length;i++){if(p<=E[i][0]){var a=E[i-1],b=E[i],t=(p-a[0])/((b[0]-a[0])||1);return a[1]+(b[1]-a[1])*t;}}return E[E.length-1][1];}
function wf(seed,o){o=o||{};var n=o.n||220,E=o.env||SONG,j=o.jag==null?.5:o.jag,r=rng(seed),t=[],b=[];for(var i=0;i<=n;i++){var x=(i/n*1000).toFixed(1),e=env(i/n,E),a=Math.max(1.2,e*((1-j)+j*r())*47);t.push(x+' '+(50-a).toFixed(1));b.unshift(x+' '+(50+a*.9).toFixed(1));}return 'M'+t.join('L')+'L'+b.join('L')+'Z';}
var FLAT=[[0,.6],[1,.6]];
class Component extends DCLogic {
  renderVals() {
    var T = ['All 6', 'Tracks', 'Stems', 'MIDI', 'Snippets', 'Versions'];
    var R = [
      ['Sophia Guerrero — The Funk', 'Track', '6:12', 'Reference only', '✓ Analyzed', 'Groove · Arrangement · Keys', 501, SONG, '#8D8A85', true],
      ['Rhodes bounce sketch', 'MIDI', '0:32', 'Owned', '✓ Analyzed', 'Harmony · Keyboard character', 502, FLAT, '#A9C46A'],
      ['Conga loop 03', 'Audio snippet', '0:08', 'Licensed', '✓ Analyzed', 'Rhythm', 503, FLAT, '#D98A5B'],
      ['Afro Drums v4', 'Previous version', '5:40', 'Owned', '✓ Analyzed', 'Arrangement', 4, SONG, '#8D8A85'],
      ['Warehouse bassline · voice memo', 'Audio snippet', '0:21', 'Owned', '● Analyzing · detecting sections', 'Not used yet', 505, FLAT, '#6FA0E6'],
      ['Untitled drum stem', 'Stem', '3:05', 'Unknown', '! Set rights before use', 'Not used', 506, SONG, '#5A5D64']
    ];
    return {
      tabs: T.map(function (l, i) { return { l: l, sel: i === 0 ? 'true' : 'false', bg: i === 0 ? '#24262B' : 'transparent', bd: i === 0 ? '#34373D' : '#2B2E34', fg: i === 0 ? '#EDEBE7' : '#B0ADA7' }; }),
      refs: R.map(function (r) {
        var ac = r[4].charAt(0) === '✓' ? '#8D8A85' : (r[4].charAt(0) === '●' ? '#5EC6D3' : '#E2BE5A');
        return { t: r[0], k: r[1], d: r[2], rights: r[3], rc: r[3] === 'Unknown' ? '#E2BE5A' : '#B0ADA7', a: r[4], ac: ac, use: r[5], w: wf(r[6], { n: 120, env: r[7], jag: .6 }), wc: r[8], bd: r[9] ? '#34373D' : '#26292E' };
      })
    };
  }
}
</script>
</body>
</html>
