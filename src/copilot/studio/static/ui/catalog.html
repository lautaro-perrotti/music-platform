<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Music Studio · UI catalog</title><link rel="stylesheet" href="/ui/base.css"><style>.catalog{max-width:1180px;margin:0 auto;padding:48px}.catalog header{padding-bottom:24px;border-bottom:1px solid var(--ms-line)}.catalog section{margin-top:32px}.catalog h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ms-faint)}.showcase{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:18px;background:var(--ms-panel);border:1px solid var(--ms-line);border-radius:var(--ms-radius-panel)}.showcase.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}.showcase ms-timeline,.showcase ms-in-doubt-panel{grid-column:1/-1;width:100%}.advanced{display:flex;gap:10px;align-items:center;margin-top:18px;color:var(--ms-muted)}.page-links{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.page-links a{padding:10px;border:1px solid var(--ms-line);border-radius:var(--ms-radius-control);background:var(--ms-raised);text-decoration:none;color:var(--ms-muted)}.page-links a:hover{color:var(--ms-text);border-color:var(--ms-cue)}@media(max-width:750px){.catalog{padding:28px 20px}.showcase.grid{grid-template-columns:1fr}.page-links{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="catalog"><header><div class="ms-eyebrow">Music Studio · Atomic Design</div><h1 class="ms-title">Component catalog</h1><p class="ms-subtitle">The design system is inspectable. Technical metadata appears only when Advanced is enabled.</p><label class="advanced">Advanced <ms-switch id="advanced"></ms-switch></label></header><section><h2>Atoms</h2><div class="showcase"><ms-button variant="primary">Primary</ms-button><ms-button variant="secondary">Secondary</ms-button><ms-button variant="ghost">Ghost</ms-button><ms-status state="succeeded"></ms-status><ms-status state="in-doubt"></ms-status><ms-role-dot role="
